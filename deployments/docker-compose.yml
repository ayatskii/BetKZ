services:
  db:
    image: postgres:15-alpine
    container_name: betkz-db
    environment:
      POSTGRES_DB: ${DB_NAME:-betkz}
      POSTGRES_USER: ${DB_USER:-betkz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-betkz_dev_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-betkz}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: betkz-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: betkz-backend
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-betkz}
      DB_PASSWORD: ${DB_PASSWORD:-betkz_dev_pass}
      DB_NAME: ${DB_NAME:-betkz}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: betkz-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
